<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เว็บแนะนำหนังสือ</title>

<style>
body {
  font-family: "Segoe UI", sans-serif;
  background: #f5f7fb;
  margin: 0;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 15px;
}

/* Search */
.search-box {
  text-align: center;
  margin-bottom: 20px;
}
.search-box input {
  width: 300px;
  max-width: 90%;
  padding: 10px 14px;
  border-radius: 20px;
  border: 1px solid #ccc;
}

/* Category */
.category {
  text-align: center;
  margin-bottom: 30px;
}
.category button {
  margin: 5px;
  padding: 8px 16px;
  border: none;
  border-radius: 20px;
  background: #e5e7eb;
  cursor: pointer;
}
.category button.active {
  background: #4f46e5;
  color: white;
}

/* Cards */
.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}
.card {
  background: white;
  border-radius: 14px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.2s;
}
.card:hover {
  transform: translateY(-5px);
}
.card img {
  width: 100%;
  height: 300px;
  object-fit: cover;
}
.card-content {
  padding: 14px;
}
.card-content h2 {
  font-size: 15px;
  margin: 0;
}
.card-content p {
  font-size: 13px;
  color: #555;
}

/* Modal */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  justify-content: center;
  align-items: center;
}
.modal-content {
  background: white;
  border-radius: 16px;
  max-width: 750px;
  width: 90%;
  padding: 20px;
  display: grid;
  grid-template-columns: 200px 1fr;
  gap: 20px;
  position: relative;
}
.modal-content img {
  width: 100%;
  border-radius: 10px;
}
.close-btn {
  position: absolute;
  top: 10px;
  right: 15px;
  font-size: 22px;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>📚 เว็บแนะนำหนังสือ</h1>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="🔍 ค้นหาหนังสือหรือผู้เขียน..." onkeyup="updateBooks()">
</div>

<div class="category">
  <button class="active" onclick="setCategory('all', event)">ทั้งหมด</button>
  <button onclick="setCategory('thai', event)">หนังสือไทย</button>
  <button onclick="setCategory('novel', event)">นิยาย</button>
  <button onclick="setCategory('self', event)">พัฒนาตนเอง</button>
  <button onclick="setCategory('knowledge', event)">ความรู้ทั่วไป</button>
</div>

<div class="container" id="book-list"></div>

<!-- Modal -->
<div class="modal" id="book-modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeDetail()">✖</span>
    <img id="modal-img">
    <div>
      <h2 id="modal-title"></h2>
      <p><b>ผู้เขียน:</b> <span id="modal-author"></span></p>
      <p><b>หมวด:</b> <span id="modal-cat"></span></p>
      <p id="modal-desc"></p>
    </div>
  </div>
</div>

<script>
let currentCategory = "all";

const books = [
  { title:"ความสุขโดยสังเกต", author:"นิ้วกลม", cat:"thai",
    img:"https://m.media-amazon.com/images/S/compressed.photo.goodreads.com/books/1437920512i/25983498.jpg",
    desc:"หนังสือที่ชวนผู้อ่านมองหาความสุขจากเรื่องเล็ก ๆ รอบตัว ผ่านข้อคิดเรียบง่ายและอบอุ่น" },

  { title:"คิดแบบยิว ทำแบบญี่ปุ่น", author:"นิ้วกลม", cat:"thai",
    img:"https://pttelibrary.pttplc.com/uploads/belibs/book/28/002735/cover_image/002735-cover.jpg",
    desc:"นำแนวคิดของวัฒนธรรมยิวและญี่ปุ่นมาประยุกต์ใช้ในการใช้ชีวิตและการทำงาน" },

  { title:"Norwegian Wood", author:"Haruki Murakami", cat:"novel",
    img:"https://m.media-amazon.com/images/I/81EWHv-3HeL._AC_UF1000,1000_QL80_.jpg",
    desc:"นิยายรักปนเศร้า เล่าเรื่องความสัมพันธ์ ความทรงจำ และการเติบโตของวัยหนุ่มสาว" },

  { title:"1984", author:"George Orwell", cat:"novel",
    img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcROYcogVlcuRtsbpOhbapax-ENsDIB7wAKezA&s",
    desc:"นิยายดิสโทเปียที่สะท้อนการควบคุมเสรีภาพและอำนาจรัฐอย่างเข้มข้น" },

  { title:"Atomic Habits", author:"James Clear", cat:"self",
    img:"https://m.media-amazon.com/images/I/81kg51XRc1L._AC_UF1000,1000_QL80_.jpg",
    desc:"อธิบายการสร้างนิสัยเล็ก ๆ ที่ทำอย่างต่อเนื่อง เพื่อเปลี่ยนชีวิตให้ดีขึ้นอย่างยั่งยืน" },

  { title:"Rich Dad Poor Dad", author:"Robert Kiyosaki", cat:"self",
    img:"https://m.media-amazon.com/images/I/81bsw6fnUiL._AC_UF1000,1000_QL80_.jpg",
    desc:"หนังสือการเงินที่เปลี่ยนมุมมองเรื่องเงิน รายได้ และการลงทุน" },

  { title:"Sapiens", author:"Yuval Noah Harari", cat:"knowledge",
    img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcScJPBpOQVqZYjHCPbomAw_lOkdjX-C-ohQhg&s",
    desc:"เล่าเรื่องราววิวัฒนาการของมนุษย์ ตั้งแต่อดีตจนถึงปัจจุบัน" }
];

const list = document.getElementById("book-list");
const modal = document.getElementById("book-modal");

function updateBooks() {
  const keyword = document.getElementById("searchInput").value.toLowerCase();
  list.innerHTML = "";

  books.filter(b =>
    (currentCategory === "all" || b.cat === currentCategory) &&
    (b.title.toLowerCase().includes(keyword) ||
     b.author.toLowerCase().includes(keyword))
  ).forEach(b => {
    list.innerHTML += `
      <div class="card" onclick='openDetail(${JSON.stringify(b)})'>
        <img src="${b.img}">
        <div class="card-content">
          <h2>${b.title}</h2>
          <p>${b.author}</p>
        </div>
      </div>
    `;
  });
}

function setCategory(cat, event) {
  currentCategory = cat;
  document.querySelectorAll(".category button").forEach(b => b.classList.remove("active"));
  event.target.classList.add("active");
  updateBooks();
}

function openDetail(book) {
  document.getElementById("modal-img").src = book.img;
  document.getElementById("modal-title").innerText = book.title;
  document.getElementById("modal-author").innerText = book.author;
  document.getElementById("modal-cat").innerText = book.cat;
  document.getElementById("modal-desc").innerText = book.desc;
  modal.style.display = "flex";
}

function closeDetail() {
  modal.style.display = "none";
}

updateBooks();
</script>

</body>
</html>
