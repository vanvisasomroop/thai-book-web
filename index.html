<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เว็บแนะนำหนังสือ</title>

<style>
body {
  font-family: "Segoe UI", sans-serif;
  background: #f5f7fb;
  margin: 0;
  padding: 20px;
}
h1 { text-align: center; margin-bottom: 15px; }

/* Search */
.search-box { text-align: center; margin-bottom: 20px; }
.search-box input {
  width: 300px; max-width: 90%;
  padding: 10px 14px;
  border-radius: 20px; border: 1px solid #ccc;
}

/* Category */
.category { text-align: center; margin-bottom: 30px; }
.category button {
  margin: 5px; padding: 8px 16px;
  border: none; border-radius: 20px;
  background: #e5e7eb; cursor: pointer;
}
.category button.active {
  background: #4f46e5; color: white;
}

/* Cards */
.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}
.card {
  background: white;
  border-radius: 14px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.2s;
}
.card:hover { transform: translateY(-5px); }
.card img {
  width: 100%;
  height: 300px;
  object-fit: cover;
}
.card-content { padding: 14px; }
.card-content h2 { font-size: 15px; margin: 0; }
.card-content p { font-size: 13px; color: #555; }

/* Modal */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  align-items: center;
  justify-content: center;
}
.modal-content {
  background: white;
  border-radius: 16px;
  max-width: 750px;
  width: 90%;
  padding: 20px;
  display: grid;
  grid-template-columns: 200px 1fr;
  gap: 20px;
  position: relative;
}
.modal-content img { width: 100%; border-radius: 10px; }
.close-btn {
  position: absolute;
  top: 10px; right: 15px;
  font-size: 22px; cursor: pointer;
}
</style>
</head>

<body>

<h1>📚 เว็บแนะนำหนังสือ</h1>

<div class="search-box">
  <input type="text" id="searchInput"
    placeholder="🔍 ค้นหาหนังสือหรือผู้เขียน..."
    onkeyup="updateBooks()">
</div>

<div class="category">
  <button class="active" onclick="setCategory('all', event)">ทั้งหมด</button>
  <button onclick="setCategory('thai', event)">หนังสือไทย</button>
  <button onclick="setCategory('novel', event)">นิยาย</button>
  <button onclick="setCategory('self', event)">พัฒนาตนเอง</button>
  <button onclick="setCategory('knowledge', event)">ความรู้ทั่วไป</button>
</div>

<div class="container" id="book-list"></div>

<!-- Modal -->
<div class="modal" id="book-modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeDetail()">✖</span>
    <img id="modal-img">
    <div>
      <h2 id="modal-title"></h2>
      <p><b>ผู้เขียน:</b> <span id="modal-author"></span></p>
      <p><b>หมวด:</b> <span id="modal-cat"></span></p>
      <p id="modal-desc"></p>

  </div>
</div>

const list = document.getElementById("book-list");
const modal = document.getElementById("book-modal");

function updateBooks() {
  const keyword = document.getElementById("searchInput").value.toLowerCase();
  list.innerHTML = "";

  books.filter(b =>
    (currentCategory === "all" || b.cat === currentCategory) &&
    (b.title.toLowerCase().includes(keyword) ||
     b.author.toLowerCase().includes(keyword))
  ).forEach(b => {
    list.innerHTML += `
      <div class="card" onclick='openDetail(${JSON.stringify(b)})'>
        <img src="${b.img}">
        <div class="card-content">
          <h2>${b.title}</h2>
          <p>${b.author}</p>
        </div>
      </div>
    `;
  });
}

function setCategory(cat, event) {
  currentCategory = cat;
  document.querySelectorAll(".category button")
    .forEach(btn => btn.classList.remove("active"));
  event.target.classList.add("active");
  updateBooks();
}

function openDetail(book) {
  document.getElementById("modal-img").src = book.img;
  document.getElementById("modal-title").innerText = book.title;
  document.getElementById("modal-author").innerText = book.author;
  document.getElementById("modal-cat").innerText = book.cat;
  document.getElementById("modal-desc").innerText = book.desc;
  modal.style.display = "flex";
}

function closeDetail() {
  modal.style.display = "none";
}

updateBooks();
</script>
