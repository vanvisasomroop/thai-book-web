<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เว็บแนะนำหนังสือ</title>

<style>
body {
  font-family: "Segoe UI", sans-serif;
  background: #f5f7fb;
  margin: 0;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 10px;
}

.category {
  text-align: center;
  margin-bottom: 30px;
}

.category button {
  margin: 5px;
  padding: 8px 16px;
  border: none;
  border-radius: 20px;
  background: #e5e7eb;
  cursor: pointer;
}

.category button.active {
  background: #4f46e5;
  color: white;
}

.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}

.card {
  background: white;
  border-radius: 14px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
  overflow: hidden;
  transition: transform 0.2s;
}

.card:hover {
  transform: translateY(-5px);
}

.card img {
  width: 100%;
  height: 300px;
  object-fit: cover;
  background: #eee;
}

.card-content {
  padding: 14px;
}

.card-content h2 {
  font-size: 15px;
  margin: 0;
}

.card-content p {
  font-size: 13px;
  color: #555;
  margin: 4px 0;
}
</style>
</head>

<body>

<h1>📚 เว็บแนะนำหนังสือ</h1>

<div class="category">
  <button class="active" onclick="filterBooks('all')">ทั้งหมด</button>
  <button onclick="filterBooks('thai')">หนังสือไทย</button>
  <button onclick="filterBooks('novel')">นิยาย</button>
  <button onclick="filterBooks('self')">พัฒนาตนเอง</button>
  <button onclick="filterBooks('knowledge')">ความรู้ทั่วไป</button>
</div>

<div class="container" id="book-list"></div>

<script>

  { title:"คิดแบบยิว ทำแบบญี่ปุ่น", author:"นิ้วกลม", cat:"thai", img:"https://pttelibrary.pttplc.com/uploads/belibs/book/28/002735/cover_image/002735-cover.jpg" },

  { title:"เพียงชายคนนี้ไม่ใช่ผู้วิเศษ", author:"วินทร์ เลียววาริณ", cat:"thai", img:"https://ds.lnwfile.com/_webp_max_images/600/600/rg/5z/3p.webp" },

  { title:"Norwegian Wood", author:"Haruki Murakami", cat:"novel", img:"https://m.media-amazon.com/images/I/81EWHv-3HeL._AC_UF1000,1000_QL80_.jpg" },
  { title:"Kafka on the Shore", author:"Haruki Murakami", cat:"novel", img:"https://www.asiabooks.com/media/catalog/product/cache/a5ac216be58c0cbce1cb04612ece96dc/9/7/9780099458326.jpg" },
  { title:"1984", author:"George Orwell", cat:"novel", img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcROYcogVlcuRtsbpOhbapax-ENsDIB7wAKezA&s" },
  { title:"Animal Farm", author:"George Orwell", cat:"novel", img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQcTa9AiYZgqOj7Q2t798c2nMICHsxTI_2uFQ&s" },
  { title:"The Little Prince", author:"Antoine de Saint-Exupéry", cat:"novel", img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR-lgF6CFQtmtIiLtJLCCfFPgOKlv8yjK6U8g&s" },

  { title:"The Alchemist", author:"Paulo Coelho", cat:"novel", img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS4T0aNvgYdBX8kfK_qYc046QFsSXhHE2NXWw&s" },

  // ===== พัฒนาตนเอง =====
  { title:"Atomic Habits", author:"James Clear", cat:"self", img:"https://m.media-amazon.com/images/I/81kg51XRc1L._AC_UF1000,1000_QL80_.jpg" },
  { title:"The Power of Habit", author:"Charles Duhigg", cat:"self", img:"https://www.penguin.co.uk/_next/image?url=https%3A%2F%2Fcdn.penguin.co.uk%2Fdam-assets%2Fbooks%2F9781847946249%2F9781847946249-jacket-large.jpg&w=819&q=100" },
  { title:"Think Like a Monk", author:"Jay Shetty", cat:"self", img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSeFv1UvQwIubE-oMjz9AanyRIcONHMm1Si7w&s" },
  { title:"Ikigai", author:"Héctor García", cat:"self", img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQN3Y0N4oTDWoAYOweXlZMElnwKRGTYvv9Jrw&s" },

  { title:"Grit", author:"Angela Duckworth", cat:"self", img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQM4rUYjbiAkTrtD_to0mbpaYF8Q4jFK1ViJA&s" },

  { title:"Homo Deus", author:"Yuval Noah Harari", cat:"knowledge", img:"https://www.asiabooks.com/media/catalog/product/cache/a5ac216be58c0cbce1cb04612ece96dc/9/7/9781784703936_5.jpg" },
  { title:"A Brief History of Time", author:"Stephen Hawking", cat:"knowledge", img:"https://bci.kinokuniya.com/jsp/images/book-img/97805/97805531/9780553176988.JPG" },
  { title:"Thinking, Fast and Slow", author:"Daniel Kahneman", cat:"knowledge", img:"https://m.media-amazon.com/images/I/61fdrEuPJwL._AC_UF1000,1000_QL80_.jpg" },
  { title:"Factfulness", author:"Hans Rosling", cat:"knowledge", img:"https://image.makewebcdn.com/makeweb/m_1200x600/7GFEYsdVK/DefaultData/Factfulness_%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%87%E0%B9%86_%E0%B9%81%E0%B8%A5%E0%B9%89%E0%B8%A7%E0%B9%82%E0%B8%A5%E0%B8%81%E0%B8%94%E0%B8%B5%E0%B8%82%E0%B8%B6%E0%B9%89%E0%B8%99%E0%B8%97%E0%B8%B8%E0%B8%81%E0%B8%A7%E0%B8%B1%E0%B8%99.jpg" },
  { title:"The Psychology of Money", author:"Morgan Housel", cat:"knowledge", img:"https://m.media-amazon.com/images/I/81gC3mdNi5L._AC_UF1000,1000_QL80_.jpg" }
];

const list = document.getElementById("book-list");

function showBooks(category) {
  list.innerHTML = "";
  books
    .filter(b => category === "all" || b.cat === category)
    .forEach(b => {
      list.innerHTML += `
        <div class="card">
          <img src="${b.img || 'https://placehold.co/400x600?text=BOOK'}">
          <div class="card-content">
            <h2>${b.title}</h2>
            <p>${b.author}</p>
          </div>
        </div>
      `;
    });
}

function filterBooks(cat) {
  document.querySelectorAll(".category button")
    .forEach(btn => btn.classList.remove("active"));
  event.target.classList.add("active");
  showBooks(cat);
}

showBooks("all");
</script>

</body>
</html>
